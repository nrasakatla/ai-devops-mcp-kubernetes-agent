<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Menlo, Consolas, monospace" font-size="13">
  <rect width="960" height="640" fill="#0f172a"/>
  <text x="480" y="34" fill="#e2e8f0" font-size="18" text-anchor="middle" font-weight="bold">ai-devops-mcp-kubernetes-agent — architecture</text>

  <!-- kind cluster -->
  <rect x="360" y="70" width="240" height="120" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="480" y="100" fill="#38bdf8" text-anchor="middle" font-weight="bold">kind cluster</text>
  <text x="480" y="122" fill="#94a3b8" text-anchor="middle">ai-devops-demo</text>
  <text x="480" y="142" fill="#94a3b8" text-anchor="middle">synthetic failure workloads</text>
  <text x="480" y="162" fill="#94a3b8" text-anchor="middle">CrashLoopBackOff · OOMKilled · Pending</text>

  <!-- collector -->
  <rect x="360" y="260" width="240" height="90" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="480" y="292" fill="#a78bfa" text-anchor="middle" font-weight="bold">src/k8s_collector.py</text>
  <text x="480" y="314" fill="#94a3b8" text-anchor="middle">read-only: get/list/describe/logs</text>
  <text x="480" y="334" fill="#94a3b8" text-anchor="middle">verb allowlist + context guard</text>

  <!-- arrows cluster -> collector -->
  <line x1="480" y1="190" x2="480" y2="260" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- analyzer -->
  <rect x="120" y="420" width="240" height="100" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="240" y="452" fill="#34d399" text-anchor="middle" font-weight="bold">src/incident_analyzer.py</text>
  <text x="240" y="474" fill="#94a3b8" text-anchor="middle">Ollama (qwen3.5:9b)</text>
  <text x="240" y="494" fill="#94a3b8" text-anchor="middle">+ deterministic rule engine</text>

  <!-- mcp server -->
  <rect x="580" y="420" width="240" height="100" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="700" y="452" fill="#f59e0b" text-anchor="middle" font-weight="bold">mcp_server/server.py</text>
  <text x="700" y="474" fill="#94a3b8" text-anchor="middle">6 read-only MCP tools</text>
  <text x="700" y="494" fill="#94a3b8" text-anchor="middle">(stdio / FastMCP)</text>

  <!-- report -->
  <rect x="120" y="560" width="240" height="60" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
  <text x="240" y="590" fill="#f87171" text-anchor="middle" font-weight="bold">src/report.py</text>
  <text x="240" y="608" fill="#94a3b8" text-anchor="middle">Markdown incident report</text>

  <!-- mcp client -->
  <rect x="580" y="560" width="240" height="60" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
  <text x="700" y="590" fill="#f87171" text-anchor="middle" font-weight="bold">MCP clients</text>
  <text x="700" y="608" fill="#94a3b8" text-anchor="middle">Claude Desktop · Cursor · agents</text>

  <!-- arrows collector -> analyzer / mcp -->
  <line x1="360" y1="305" x2="240" y2="420" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="305" x2="700" y2="420" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- arrows analyzer -> report, mcp -> client -->
  <line x1="240" y1="520" x2="240" y2="560" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="520" x2="700" y2="560" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- safety note -->
  <text x="480" y="630" fill="#64748b" text-anchor="middle" font-size="11">all paths read-only · advisory-only remediation · no production access</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
