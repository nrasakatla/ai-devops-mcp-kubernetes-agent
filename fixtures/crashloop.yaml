# CrashLoopBackOff fixture.
#
# The container starts, then immediately exits with a non-zero code, triggering
# exponential back-off restarts. This demonstrates the CrashLoopBackOff class.
#
# NOTE: This is synthetic demo data only. It contains no real secrets, internal
# DNS names, private IPs, or customer information.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloop-demo
  namespace: ai-devops-ns
  labels:
    app: crashloop-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crashloop-demo
  template:
    metadata:
      labels:
        app: crashloop-demo
    spec:
      restartPolicy: Always
      containers:
        - name: crashloop
          image: busybox:1.36
          command: ["sh", "-c", "echo 'starting demo app'; echo 'fatal: demo error' >&2; exit 1"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
