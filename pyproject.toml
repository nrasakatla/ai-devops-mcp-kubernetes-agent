requires-python = ">=3.10"
dependencies = [
    "kubernetes>=29.0.0",
    "mcp>=1.0.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
]

[project]
name = "ai-devops-mcp-kubernetes-agent"
version = "0.1.0"
description = "AI-assisted Kubernetes troubleshooting with a read-only MCP server and Ollama-powered root-cause analysis"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
